spring.config.import=optional:classpath:application-mail.properties
spring.application.name=protegeela
# Avoid request/response bodies, credentials and coordinate parameters in diagnostic logs.
spring.mvc.log-request-details=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:postgres}
spring.data.redis.password=${REDIS_PASSWORD:luiz}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
spring.data.redis.repositories.enabled=false
server.port=${PORT:8080}
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
# Informe somente o hostname do PostgreSQL em DB_HOST; a URL JDBC e montada aqui.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:protegeela}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:luiz}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.table=protegeela_schema_history
# Mantem o historico existente mesmo com os scripts antigos consolidados em V5.
spring.flyway.ignore-migration-patterns=*:missing
# Bancos sem historico recebem baseline e executam a migration consolidada V5.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

app.places.overpass-url=${OVERPASS_API_URL:https://overpass-api.de/api/interpreter}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.check-in.scan-delay-ms=${CHECK_IN_SCAN_DELAY_MS:15000}
