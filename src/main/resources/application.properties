spring.config.import=optional:file:./application-local.properties
spring.application.name=protegeela
# Avoid request/response bodies, credentials and coordinate parameters in diagnostic logs.
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
spring.data.redis.repositories.enabled=false
server.port=${PORT:8080}
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/protegeela}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=protegeela_schema_history
# Historico atual independente; preserva users/auth_sessions e o historico legado.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

app.places.overpass-url=${OVERPASS_API_URL:https://overpass-api.de/api/interpreter}
